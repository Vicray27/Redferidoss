services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ_DEFAULT:-America/Caracas}
      # Portainer stack env vars only feed ${...} interpolation. A container
      # receives NOTHING unless it is listed here or in env_file. The app
      # queries Postgres at runtime (lib/db.ts), so DATABASE_URL must be
      # mapped explicitly or every server-side page throws
      # PrismaClientInitializationError.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - set it in the Portainer stack env vars}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required - set it in the Portainer stack env vars}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      ROOT_EMAIL: ${ROOT_EMAIL:-root@example.com}
      CRON_SECRET: ${CRON_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-referidos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # PR2 decision (D1, see docs/decisiones.md): stock postgres:16 ships the
  # contrib modules 0001_init needs (ltree, pgcrypto, citext). pg_cron is NOT
  # in the stock image; the pg_cron-capable image choice is deferred to F7
  # (jobs) — design fallback is node-cron behind POST /api/cron/{job}.
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-referidos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-referidos_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-referidos}
      TZ: ${TZ_DEFAULT:-America/Caracas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-referidos} -d $${POSTGRES_DB:-referidos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # minio disabled for now - image pull blocked (401 on quay + denied on docker hub)
  # re-enable later with working registry; app /api/health does not need S3
  # minio:
  #   image: quay.io/minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   restart: unless-stopped
  #   environment:
  #     MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
  #     MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-minio-dev-only}
  #     TZ: ${TZ_DEFAULT:-America/Caracas}
  #   volumes:
  #     - minio-data:/data
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 20s

volumes:
  pgdata:
  minio-data:
